name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  clients:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [agent-app, web-client]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - run: npm ci

      - run: npx vitest --run

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Syntax check
        run: for f in $(git ls-files '*.js'); do node --check "$f"; done